spring.application.name=agrodata-api

# Configuração padrão para ambiente local sem MySQL instalado.
# Para usar MySQL real, troque pelas credenciais do seu banco.
spring.datasource.url=jdbc:h2:mem:agrodata;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
